<!-- @format 1640px 624px  @sortie png
     Couverture de la page Facebook. Facebook rogne les côtés sur mobile : contenu centré. -->
<style>
  .page { width: 1640px; height: 624px; display: flex; align-items: center; justify-content: center; gap: 70px; }
  .logo { width: 380px; height: 380px; box-shadow: 0 0 120px rgb(184 165 216 / .3); }
  .nom { font-size: 78px; color: #fff; }
  .accroche { font-size: 34px; margin-top: 12px; color: var(--c-lavande); }
  .lieu { font-size: 28px; margin-top: 26px; color: var(--c-rose); letter-spacing: .1em; }
</style>
<div class="page ciel">
  <img class="logo" src="{{logo}}" alt="">
  <div>
    <div class="nom">Clair de Lune</div>
    <div class="accroche">{{infos.accroche}}</div>
    <div class="lieu">Broc · Gruyère · sur rendez-vous {{infos.telephone}}</div>
  </div>
</div>
