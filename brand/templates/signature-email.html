<!-- @sortie html
     Signature email : ouvrir brand/sortie/signature-email.html dans le navigateur, tout sélectionner, copier, coller dans les réglages de signature de Gmail. -->
<table cellpadding="0" cellspacing="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#2a2238;line-height:1.45">
  <tr>
    <td style="padding-right:14px;vertical-align:top"><img src="https://www.institutclairdelune.ch/icons/icon-192.png" width="64" height="64" alt="Clair de Lune" style="border-radius:50%;display:block"></td>
    <td style="border-left:2px solid #b7a6d0;padding-left:14px;vertical-align:top">
      <div style="font-family:Georgia,serif;font-size:16px;color:#3a2550">{{infos.praticienne}}</div>
      <div style="color:#4a3366;font-size:11px;letter-spacing:1px;text-transform:uppercase">{{infos.titre}} · Institut Clair de Lune</div>
      <div style="margin-top:6px">{{infos.adresse.rue}}, {{infos.adresse.npa}} {{infos.adresse.localite}}<br>
      <a href="tel:{{infos.telephoneInternational}}" style="color:#2a2238;text-decoration:none">{{infos.telephone}}</a> · <a href="https://www.institutclairdelune.ch/" style="color:#4a3366">institutclairdelune.ch</a></div>
    </td>
  </tr>
</table>
