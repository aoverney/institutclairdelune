<!-- @format 91mm 61mm (85×55 mm + 3 mm de fond perdu)  @sortie pdf -->
<style>
  @page { size: 91mm 61mm; margin: 0; }
  .page { width: 91mm; height: 61mm; }
  .recto { display: grid; place-items: center; }
  .recto .cartouche { width: 62mm; padding: 4mm 3mm 3.5mm; outline-offset: 1.2mm; }
  .recto .logo { width: 17mm; height: 17mm; margin: 0 auto 2mm; }
  .recto .nom { font-size: 13pt; color: var(--c-aubergine); }
  .recto .accroche { font-size: 7.5pt; margin-top: .8mm; color: var(--c-encre-douce); }
  .verso { padding: 7mm 9mm; }
  .verso .surtitre { font-size: 6.5pt; margin-bottom: 2.5mm; }
  .rdv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4mm; }
  .rdv div { border-bottom: .2mm solid var(--c-lavande-moyen); height: 7.5mm; font-size: 6.5pt; color: var(--c-encre-douce); display: flex; align-items: flex-end; padding-bottom: .6mm; }
  .verso .pied { position: absolute; left: 9mm; right: 9mm; bottom: 7mm; font-size: 6.8pt; color: var(--c-encre-douce); display: flex; justify-content: space-between; }
  .verso .pied { gap: 3mm; align-items: flex-end; }
  .verso .pied strong { color: var(--c-aubergine); font-weight: 500; white-space: nowrap; font-size: 8pt; }
</style>
<div class="page ciel recto">
  <div class="cartouche">
    <img class="logo" src="{{logo}}" alt="">
    <div class="nom">Clair de Lune</div>
    <div class="accroche">{{infos.accroche}}</div>
  </div>
</div>
<div class="page papier verso">
  <div class="surtitre">Vos prochains rendez-vous</div>
  <div class="rdv">
    <div>Le</div><div>à</div>
    <div>Le</div><div>à</div>
    <div>Le</div><div>à</div>
  </div>
  <div class="pied"><span>En cas d'empêchement, merci de prévenir 24 h à l'avance.</span><strong>{{infos.telephone}}</strong></div>
</div>
